<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hoàng Mạnh & Phương Thảo | Happy Wedding</title>
  <meta name="description" content="Album ảnh cưới của Hoàng Mạnh và Phương Thảo." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <section class="hero" style="background-image: url('img/08.jpg');">
    <div class="hero-content">
      <div class="hero-label">We are getting married</div>
      <h1 class="hero-names">Hoàng Mạnh<br>&amp; Phương Thảo</h1>
      <div class="hero-divider"></div>
      <p class="hero-date">Trân trọng lưu giữ những khoảnh khắc hạnh phúc</p>
    </div>
    <div class="scroll-hint">⌄</div>
  </section>

  <section class="section">
    <div class="container">
      <h2 class="section-title">Khoảnh khắc</h2>
      <p class="section-subtitle">Một vài hình ảnh trong ngày trọng đại của chúng tôi.</p>

      <div class="gallery-grid">
        <figure><img src="img/01.jpg" alt="Ảnh cưới 1" loading="lazy"></figure>
        <figure><img src="img/02.jpg" alt="Ảnh cưới 2" loading="lazy"></figure>
        <figure><img src="img/03.jpg" alt="Ảnh cưới 3" loading="lazy"></figure>
        <figure><img src="img/04.jpg" alt="Ảnh cưới 4" loading="lazy"></figure>
        <figure><img src="img/05.jpg" alt="Ảnh cưới 5" loading="lazy"></figure>
        <figure><img src="img/06.jpg" alt="Ảnh cưới 6" loading="lazy"></figure>
        <figure><img src="img/07.jpg" alt="Ảnh cưới 7" loading="lazy"></figure>
        <figure><img src="img/08.jpg" alt="Ảnh cưới 8" loading="lazy"></figure>
        <figure><img src="img/09.jpg" alt="Ảnh cưới 9" loading="lazy"></figure>
        <figure><img src="img/10.jpg" alt="Ảnh cưới 10" loading="lazy"></figure>
        <figure><img src="img/11.jpg" alt="Ảnh cưới 11" loading="lazy"></figure>
        <figure><img src="img/12.jpg" alt="Ảnh cưới 12" loading="lazy"></figure>
        <figure><img src="img/13.jpg" alt="Ảnh cưới 13" loading="lazy"></figure>
      </div>
    </div>
  </section>

  <footer class="site-footer">
    <div class="footer-names">Hoàng Mạnh &amp; Phương Thảo</div>
    <p>Cảm ơn bạn đã ghé thăm trang của chúng tôi 💛</p>
    <p>© 2026</p>
  </footer>

  <div class="lightbox">
    <button class="lightbox-close" aria-label="Đóng">✕</button>
    <button class="lightbox-prev" aria-label="Ảnh trước">‹</button>
    <img src="" alt="">
    <button class="lightbox-next" aria-label="Ảnh sau">›</button>
  </div>

  <div class="music-player">
    <span class="music-label">Nhạc nền</span>
    <button class="music-btn" data-audio="audio-1" aria-label="Phát nhạc nền 1">♪1</button>
    <button class="music-btn" data-audio="audio-2" aria-label="Phát nhạc nền 2">♪2</button>
  </div>
  <audio id="audio-1" src="mp3/nhac-nen-1.mp3" loop preload="none"></audio>
  <audio id="audio-2" src="mp3/nhac-nen-2.mp3" loop preload="none"></audio>

  <script src="js/main.js"></script>
</body>
</html>
